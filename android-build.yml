name: Android Build (Nanzz Musify APK)

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" || \
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" || \
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show build environment
        run: |
          java -version
          ./gradlew --version

      - name: Build Debug APK
        id: debug_build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --console=plain --stacktrace --no-daemon 2>&1 | tee build-debug.log

      - name: Upload Debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanzz-musify-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanzz-musify-debug-log
          path: build-debug.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build Release APK
        id: release_build
        if: always()
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --console=plain --stacktrace --no-daemon 2>&1 | tee build-release.log

      - name: Upload Release APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanzz-musify-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Release Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nanzz-musify-release-log
          path: build-release.log
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if Debug or Release failed
        if: always()
        run: |
          debug='${{ steps.debug_build.outcome }}'
          release='${{ steps.release_build.outcome }}'
          echo "Debug result: $debug"
          echo "Release result: $release"
          if [[ "$debug" != "success" || "$release" != "success" ]]; then
            echo "Build gagal. Cek artifact log."
            exit 1
          fi
          echo "Debug dan Release APK berhasil."
